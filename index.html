<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Burger House — Solicitud</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B35">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HR Burger">
  <link rel="apple-touch-icon" href="logo.jpeg">
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <div class="logo">
        <img src="logo.jpeg" alt="HR Burger House" class="logo-img">
        <span class="logo-text">HR <strong>Burger House</strong></span>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-link active">Nueva Solicitud</a>
        <button class="btn-theme" id="themeToggle" title="Modo oscuro">🌙</button>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <div class="page-hero">
      <h1>HR Burger House</h1>
      <p>Sistema de solicitud de productos al almacén.</p>
    </div>

    <!-- Tabs empleado -->
    <div class="tabs">
      <button class="tab active" data-tab="nueva">📋 Nueva Solicitud</button>
      <button class="tab" data-tab="mis">🔍 Mis Solicitudes</button>
    </div>

    <!-- ── TAB NUEVA SOLICITUD ── -->
    <div id="tab-nueva">

    <form id="requestForm" novalidate>

      <!-- Información del solicitante -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">👤</span>
          <h2>Información del Solicitante</h2>
        </div>
        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="solicitante">Nombre completo <span class="required">*</span></label>
            <input type="text" id="solicitante" placeholder="Tu nombre completo" required>
          </div>
          <div class="form-group">
            <label for="area">Área / Puesto <span class="required">*</span></label>
            <select id="area" required>
              <option value="">Seleccionar área...</option>
              <option>Cocina</option>
              <option>Caja</option>
              <option>Almacén</option>
              <option>Gerencia</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="prioridad">Prioridad <span class="required">*</span></label>
            <select id="prioridad" required>
              <option value="normal">Normal</option>
              <option value="urgente">🔴 Urgente</option>
              <option value="programado">🗓️ Programado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fechaRequerida">Fecha requerida <span class="required">*</span></label>
            <input type="date" id="fechaRequerida" required>
          </div>
        </div>
      </div>

      <!-- Carrito de productos -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">🛒</span>
          <h2>Productos a Solicitar</h2>
        </div>

        <div class="add-product-row">
          <div class="form-group" style="flex:2">
            <label for="selectProducto">Producto</label>
            <select id="selectProducto" onchange="onProductoChange(this)">
              <option value="">Seleccionar producto...</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <label for="inputCantidad">Cantidad</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="number" id="inputCantidad" min="1" value="1" style="width:80px">
              <span id="unidadLabel" class="product-unit" style="min-width:40px">—</span>
            </div>
          </div>
          <div class="form-group add-btn-group">
            <label>&nbsp;</label>
            <button type="button" class="btn btn-primary" onclick="agregarProducto()">+ Agregar</button>
          </div>
        </div>

        <div id="cartList" class="cart-list">
          <p class="cart-empty">Aún no has agregado productos a la solicitud.</p>
        </div>
      </div>

      <!-- Notas y correo -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">📝</span>
          <h2>Notas y Envío</h2>
        </div>
        <div class="form-group">
          <label for="notas">Observaciones adicionales</label>
          <textarea id="notas" rows="3" placeholder="Instrucciones especiales, proveedor preferido, urgencias, etc."></textarea>
        </div>
      </div>


      <div class="form-actions">
        <button type="button" id="clearBtn" class="btn btn-ghost">Limpiar formulario</button>
        <button type="submit" class="btn btn-primary">
          <span>📤</span> Enviar Solicitud
        </button>
      </div>

    </form>
    </div> <!-- /tab-nueva -->

    <!-- ── TAB MIS SOLICITUDES ── -->
    <div id="tab-mis" class="hidden">

      <div id="buscarNombreWrap" class="card" style="padding:16px 24px; margin-bottom:var(--gap); display:none;">
        <div class="form-group" style="margin:0; display:flex; gap:12px; align-items:flex-end;">
          <div style="flex:1">
            <label for="buscarNombre">Tu nombre para buscar tus solicitudes</label>
            <input type="text" id="buscarNombre" placeholder="Escribe tu nombre completo...">
          </div>
          <button type="button" class="btn btn-primary" onclick="buscarSolicitudes()">Buscar</button>
        </div>
      </div>
      <div id="misSolicitudesLista"></div>

    </div> <!-- /tab-mis -->

  </div>
</main>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Overlay de carga -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-content">
    <div class="spinner"></div>
    <p>Enviando solicitud...</p>
  </div>
</div>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<!-- App -->
<script src="js/theme.js"></script>
<script src="js/config.js?v=3"></script>
<script src="js/products.js?v=3"></script>
<script src="js/app.js?v=4"></script>

</body>
</html>
